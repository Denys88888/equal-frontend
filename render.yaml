services:
  - type: web
    name: equal-app
    runtime: static
    plan: starter
    branch: master
    buildCommand: >
      npm ci && npm run build &&
      mkdir -p dist/privacy dist/terms dist/discover dist/matches dist/clubs dist/events dist/profile dist/settings dist/onboarding dist/chat &&
      for d in privacy terms discover matches clubs events profile settings onboarding chat; do cp dist/index.html dist/$d/index.html; done
    staticPublishPath: ./dist
    nodeVersion: "20.11.0"
    envVars:
      - key: VITE_API_URL
        value: https://equal-backend.onrender.com/v1
      - key: VITE_WS_URL
        value: wss://equal-backend.onrender.com
      # App is registered as Testnet in the Pi Developer Portal. Without this,
      # Pi.init() defaults to sandbox:false (mainnet) at build time, and the
      # Pi wallet rejects createPayment() for a mainnet request against an
      # app that's only approved for testnet — every payment (gifts, donate)
      # fails silently from the user's point of view.
      - key: VITE_PI_SANDBOX
        value: "true"
