services:
  - type: web
    name: equal-app
    runtime: static
    plan: starter
    branch: master
    buildCommand: >
      npm ci && npm run build &&
      mkdir -p dist/privacy dist/terms dist/discover dist/matches dist/clubs dist/events dist/profile dist/settings dist/onboarding dist/chat &&
      for d in privacy terms discover matches clubs events profile settings onboarding chat; do cp dist/index.html dist/$d/index.html; done
    staticPublishPath: ./dist
    nodeVersion: "20.11.0"
    envVars:
      - key: VITE_API_URL
        value: https://equal-backend.onrender.com/v1
      - key: VITE_WS_URL
        value: wss://equal-backend.onrender.com
      # App is registered as Mainnet in the Pi Developer Portal.
      # sandbox:false = real Pi payments on mainnet.
      - key: VITE_PI_SANDBOX
        value: "false"
